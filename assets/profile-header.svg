<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Elias Prendez — Open-source builder</title>
  <desc id="desc">A dark geometric header for an engineer building AI systems and decentralized infrastructure in public.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.5" stop-color="#10152e"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity=".07"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="875" cy="170" rx="330" ry="260" fill="url(#glow)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M760 84h86l43 43h96l51 51h114" stroke="#22d3ee" stroke-opacity=".32"/>
    <path d="M718 274h105l42-42h116l46-46h123" stroke="#f472b6" stroke-opacity=".24"/>
    <path d="M887 64v45l34 34v91l-36 36v32" stroke="#a78bfa" stroke-opacity=".35"/>
    <path d="M1043 58v60l-27 27v62l29 29v62" stroke="#22d3ee" stroke-opacity=".25"/>
    <g fill="#0b1528" stroke-width="2">
      <circle cx="846" cy="84" r="6" stroke="#22d3ee"/>
      <circle cx="889" cy="127" r="6" stroke="#8b5cf6"/>
      <circle cx="985" cy="127" r="6" stroke="#f472b6"/>
      <circle cx="865" cy="232" r="6" stroke="#22d3ee"/>
      <circle cx="981" cy="232" r="6" stroke="#8b5cf6"/>
      <circle cx="1027" cy="186" r="6" stroke="#f472b6"/>
    </g>
  </g>

  <g transform="translate(72 68)">
    <rect width="54" height="6" rx="3" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="0" y="66" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="54" font-weight="750" letter-spacing="2">ELIAS PRENDEZ</text>
    <text x="2" y="108" fill="#b8c4d9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" letter-spacing="2.8">OPEN-SOURCE BUILDER</text>
    <path d="M2 137h510" stroke="url(#accent)" stroke-width="2" stroke-opacity=".7"/>
    <text x="2" y="177" fill="#dbeafe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">AI systems  ·  developer infrastructure  ·  decentralized networks</text>
    <g transform="translate(2 207)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">
      <rect width="169" height="34" rx="17" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".55"/>
      <circle cx="20" cy="17" r="4" fill="#22d3ee"/>
      <text x="34" y="22" fill="#a5f3fc">BUILDING IN PUBLIC</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="url(#accent)" stroke-opacity=".32" stroke-width="2"/>
</svg>
